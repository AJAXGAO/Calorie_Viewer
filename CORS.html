<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- 內容安全政策：只執行同網站的 JS / CSS，只允許連線到 UGS 與自己的 Azure Function -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src https://player-auth.services.api.unity.com https://calorieapi-gkg4f9fph4fddpcc.westus3-01.azurewebsites.net; base-uri 'none'; form-action 'none'">

<!-- 連到其他網站時不帶出本頁網址 -->
<meta name="referrer" content="no-referrer">

<title>Azure 連線測試</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="page">
  <h1>Azure 連線測試（/api/whoami）</h1>
  <p><small>登入 UGS 取得 token → 由 Azure 驗證並回傳 player_id。密碼只用於這次登入，不會儲存；token 只保留在這個分頁的記憶體中。</small></p>

  <div id="sign_in_area">
    <label>帳號名稱
      <input id="username" autocomplete="username" maxlength="20">
    </label>
    <label>密碼
      <input id="password" type="password" autocomplete="current-password" maxlength="30">
    </label>
  </div>

  <div class="buttons">
    <button id="btn_sign_in">1. 登入 UGS</button>
    <button id="btn_whoami" disabled>2. 呼叫 /api/whoami</button>
    <button id="btn_bad_token" disabled>3. 用錯誤 token 測試（應被拒絕）</button>
    <button id="btn_sign_out" disabled>登出</button>
  </div>

  <pre id="log">尚未登入</pre>
</div>

<script src="config.js"></script>
<script src="whoami_test.js"></script>
</body>
</html>
